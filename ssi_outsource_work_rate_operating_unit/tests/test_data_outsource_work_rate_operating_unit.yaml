options:
  auto_refresh: true

setup:
  steps:
    - step: "Get internal user group"
      action: "ref"
      xml_id: "base.group_user"
      save_as: "grp_internal"

    - step: "Get outsource work rate user group"
      action: "ref"
      xml_id: "ssi_outsource_work_rate.outsource_work_rate_user_group"
      save_as: "grp_rate_user"

    - step: "Get outsource work rate operating unit group"
      action: "ref"
      xml_id: "ssi_outsource_work_rate_operating_unit.outsource_work_rate_ou_group"
      save_as: "grp_rate_ou"

    # `setup:` replays before every scenario inside the same transaction
    # (no rollback in between), so a fixed code or login would collide
    # with the previous scenario's record on the 2nd and later replay.
    # Generate a fresh, never-colliding value on each replay.
    - step: "Create partner for operating unit A"
      action: "create"
      model: "res.partner"
      save_as: "ou_a_partner"
      values:
        name: "Test Rate OU-A Partner"

    - step: "Create operating unit A"
      action: "create"
      model: "operating.unit"
      save_as: "ou_a"
      values:
        name: "EVAL: 'Test Rate OU-A %d' % env['operating.unit'].search_count([])"
        code: "EVAL: 'RATEOUA%d' % env['operating.unit'].search_count([])"
        partner_id: "REC: ou_a_partner.id"

    - step: "Create partner for operating unit B"
      action: "create"
      model: "res.partner"
      save_as: "ou_b_partner"
      values:
        name: "Test Rate OU-B Partner"

    - step: "Create operating unit B"
      action: "create"
      model: "operating.unit"
      save_as: "ou_b"
      values:
        name: "EVAL: 'Test Rate OU-B %d' % env['operating.unit'].search_count([])"
        code: "EVAL: 'RATEOUB%d' % env['operating.unit'].search_count([])"
        partner_id: "REC: ou_b_partner.id"

    - step: "Create user assigned to operating unit A"
      action: "create"
      model: "res.users"
      save_as: "user_a"
      values:
        name: "Outsource Work Rate OU-A Rule User"
        login: "EVAL: 'owr_ou_a_rule_user_%d' % env['res.users'].search_count([])"
        groups_id:
          - - 6
            - 0
            - - "REC: grp_internal.id"
              - "REC: grp_rate_user.id"
              - "REC: grp_rate_ou.id"
        default_operating_unit_id: "REC: ou_a.id"
        assigned_operating_unit_ids:
          - - 6
            - 0
            - - "REC: ou_a.id"

    - step: "Create user assigned to operating unit B"
      action: "create"
      model: "res.users"
      save_as: "user_b"
      values:
        name: "Outsource Work Rate OU-B Rule User"
        login: "EVAL: 'owr_ou_b_rule_user_%d' % env['res.users'].search_count([])"
        groups_id:
          - - 6
            - 0
            - - "REC: grp_internal.id"
              - "REC: grp_rate_user.id"
              - "REC: grp_rate_ou.id"
        default_operating_unit_id: "REC: ou_b.id"
        assigned_operating_unit_ids:
          - - 6
            - 0
            - - "REC: ou_b.id"

    - step: "Create product for the rate detail"
      action: "create"
      model: "product.product"
      save_as: "product"
      values:
        name: "Test Rate OU Product"
        type: "service"

    - step: "Get default price list"
      action: "ref"
      xml_id: "product.list0"
      save_as: "pricelist"

scenarios:
  - name: "OutsourceWorkRate - Operating unit is stored on the document"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "rate_partner"
        values:
          name: "Test Rate OU Partner"
          is_company: false

      - step: "Create rate with an operating unit"
        action: "create"
        model: "outsource_work_rate"
        save_as: "rate"
        values:
          partner_id: "REC: rate_partner.id"
          date: "2024-01-01"
          date_start: "2024-01-01"
          operating_unit_id: "REF: operating_unit.main_operating_unit"
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                pricelist_id: "REC: pricelist.id"

      - step: "Assert rate operating_unit_id is set"
        action: "assert"
        target: "rate"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "OutsourceWorkRate - Operating unit record rule scopes access"
    steps:
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "rule_partner"
        values:
          name: "Test Rate OU Rule Partner"
          is_company: false

      - step: "Create rate of operating unit A, owned by a third user"
        action: "create"
        model: "outsource_work_rate"
        save_as: "rule_rate"
        values:
          partner_id: "REC: rule_partner.id"
          date: "2024-01-01"
          date_start: "2024-01-01"
          operating_unit_id: "REC: ou_a.id"
          user_id: "REF: base.user_admin"
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                pricelist_id: "REC: pricelist.id"

      - step: "Rate is scoped to operating unit A"
        action: "assert"
        target: "rule_rate"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou_a"

      - step: "Truth gate: the document owner is neither of the two test users"
        action: "assert"
        target: "rule_rate"
        asserts:
          user_id:
            type: "m2o"
            expected_xml_id: "base.user_admin"

      - step: "User of a different operating unit cannot see it"
        action: "search"
        model: "outsource_work_rate"
        as_user: "user_b"
        domain:
          - ["id", "=", "REC: rule_rate.id"]
        save_as: "seen_by_b"
        expect_count: 0

      - step: "User of the same operating unit can see it"
        action: "search"
        model: "outsource_work_rate"
        as_user: "user_a"
        domain:
          - ["id", "=", "REC: rule_rate.id"]
        save_as: "seen_by_a"
        expect_count: 1

      - step: "User of a different operating unit cannot write to it"
        action: "write"
        target: "rule_rate"
        as_user: "user_b"
        expect_error:
          type: "AccessError"
        values:
          date: "2024-02-01"
