                price_unit: 100000.0
                account_id: "REC: account.id"
                analytic_account_id: "REC: aa_a.id"

      - step: "Adding a line of analytic account B is rejected"
        action: "write"
        target: "acceptance"
        as_user: "base.user_admin"
        expect_error:
          type: "ValidationError"
          message_contains: "different analytic account"
        values:
          outsource_work_ids:
            - - 0
              - 0
              - model_id: "REC: owa_model.id"
                partner_id: "REC: partner.id"
                type_id: "REC: work_type.id"
                uom_quantity: 1.0
                price_unit: 25000.0
                account_id: "REC: account.id"
                analytic_account_id: "REC: aa_b.id"

  - name:
      "OutsourceWorkAcceptance - Confirm is blocked when a line was moved to another
      analytic account"
    steps:
      - step: "Create acceptance with one line"
        action: "create"
        model: "outsource_work_acceptance"
        save_as: "acceptance"
        as_user: "base.user_admin"
        values:
