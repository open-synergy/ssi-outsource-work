  - name: "OutsourceWorkAcceptance - Cancel from draft through wizard then restart"
    steps:
      - step: "Create acceptance with lines"
        action: "create"
        model: "outsource_work_acceptance"
        save_as: "acceptance"
        as_user: "base.user_admin"
        values:
          analytic_account_id: "REC: aa_a.id"
