                analytic_account_id: "REC: aa_a.id"

      - step: "Find the line of the acceptance"
        action: "search"
        model: "outsource_work"
        domain:
          - ["work_object_id", "=", "REC: acceptance.id"]
          - ["model_name", "=", "outsource_work_acceptance"]
        save_as: "line1"
        limit: 1

      - step: "Move the line to analytic account B directly on the line"
        action: "write"
        target: "line1"
        as_user: "base.user_admin"
        values:
          analytic_account_id: "REC: aa_b.id"

      - step: "Confirm is rejected"
        action: "call"
        target: "acceptance"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "different analytic account"

  - name: "OutsourceWorkAcceptance - Header without analytic account is rejected"
    steps:
      - step: "Saving the form without analytic account fails"
        action: "form"
        model: "outsource_work_acceptance"
        as_user: "base.user_admin"
        expect_error:
          type: "AssertionError"
          message_contains: "analytic_account_id is a required field"
        values:
          date: "EVAL: date(2026, 1, 15)"
          currency_id: "RECORDSET: base.USD"
          pricelist_id: "REC: pricelist"
